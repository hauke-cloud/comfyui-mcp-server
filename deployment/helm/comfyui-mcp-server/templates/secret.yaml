{{- if include "comfyui-mcp-server.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "comfyui-mcp-server.fullname" . }}
  labels:
    {{- include "comfyui-mcp-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.auth.apiToken }}
  API_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.comfyuiApiKey }}
  COMFYUI_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
