[project]
name = "comfyui-mcp-server"
version = "0.1.0"
description = "MCP server and REST API that serve curated ComfyUI workflows as tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "hauke-cloud" }]
# Keep in sync with requirements.txt, which pins these for the image and CI.
dependencies = [
    "mcp>=2.2,<3",
    # Already pulled in by mcp; declared because the ComfyUI client imports it.
    "httpx2>=2.13",
    "pyyaml>=6",
    "starlette>=1",
    "uvicorn>=0.35",
]

[project.urls]
Homepage = "https://github.com/hauke-cloud/comfyui-mcp-server"
Repository = "https://github.com/hauke-cloud/comfyui-mcp-server"

[project.scripts]
comfyui-mcp-server = "comfyui_mcp_server.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The shared CI action installs requirements files but not the package itself.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE", "S110"]
